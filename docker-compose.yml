version: '3.8'

services:
  # --------------------------------------------------------
  # 1. PostgreSQL Database Service
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: placement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: placement_portal
      POSTGRES_USER: placement_user
      POSTGRES_PASSWORD: placement_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/postgresql_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_user -d placement_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - placement_net

  # --------------------------------------------------------
  # 2. Backend API Service (with real Java sandbox)
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:[YOUR-PASSWORD]@db.[YOUR-PROJECT-REF].supabase.co:5432/postgres}
      DATABASE_SSL: "true"
      JWT_SECRET: ${JWT_SECRET:-production_super_secret_jwt_key_at_least_32_characters_long}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-dummy_id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-dummy_secret}
      GITHUB_CALLBACK_URL: http://localhost/github/callback
      GITHUB_API_URL: https://api.github.com
      DOCKER_AVAILABLE: "false"
      EXECUTION_TIMEOUT_MS: 5000
      MAX_MEMORY_MB: 128
    ports:
      - "5000:5000"
    networks:
      - placement_net

  # --------------------------------------------------------
  # 3. Frontend Web Client (Nginx Reverse Proxy)
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - placement_net

volumes:
  postgres_data:
    driver: local

networks:
  placement_net:
    driver: bridge
